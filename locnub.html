<!DOCTYPE html>
<html>
<head>
	<title>Website Search</title>
	<script>
		const searchCommands = {
			"g": "https://www.google.com/search?q=",
			"am": "https://www.amazon.com/s?k=",
			"yt": "https://www.youtube.com/results?search_query=",
                        "wk": "https://en.wikipedia.org/wiki/",
                        "gd": "https://www.goodreads.com/search?q=",
                        "ad": "https://www.audible.com/search?keywords=",
                        "hb": "https://www.heb.com/search/?q=",
                        "dr": "https://www.drupal.org/search/site/",
                        "rd": "https://www.reddit.com/search/?q=",
                        "sl": "https://slickdeals.net/newsearch.php?q=",
                        "st": "https://stackoverflow.com/search?q=",
                        "tw": "https://twitter.com/search?q=",
                        "gt": "https://github.com/search?q=",
                        "ar": "https://archive.org/search.php?query="
		};

		function submitForm() {
			var query = document.getElementById("search-box").value.trim();
			if (query.length === 0) {
				return;
			}
			var command = query.split(" ")[0];
			var url = searchCommands[command] || searchCommands["g"];
			if (command in searchCommands) {
				window.location.href = url + encodeURIComponent(query.slice(command.length + 1));
			} else {
				window.location.href = searchCommands["g"] + encodeURIComponent(query);
			}
		}
	</script>
</head>
<body onload="document.getElementById('search-box').focus();">
	<form onsubmit="submitForm(); return false;">
		<input type="text" id="search-box" name="q" placeholder="Search" autocomplete="off">
		<button type="submit">Search</button>
	</form>
	<p>Available commands: g, am, yt, wk, gd, ad, hb, dr, rd, sl, st, tw, gt, ar</p>
	<script>
		var urlParams = new URLSearchParams(window.location.search);
		var query = urlParams.get("q");
		if (query) {
			document.getElementById("search-box").value = query;
			submitForm();
		}
	</script>
</body>
</html>
