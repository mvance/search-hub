<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Search Page</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
</head>
<body>
	<div class="container">
		<form action="https://www.google.com/search" method="GET">
			<input type="text" class="u-full-width" placeholder="Search..." name="q">
			<input type="submit" value="Search">
		</form>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			document.querySelector('input[type="text"]').focus();
		});

		const searchCommands = {
			'g': 'https://www.google.com/search?q=',
			'a': 'https://www.amazon.com/s?k=',
			'w': 'https://en.wikipedia.org/w/index.php?search=',
			'gr': 'https://www.goodreads.com/search?q=',
			'ab': 'https://www.audible.com/search?keywords=',
			'heb': 'https://www.heb.com/search/?term=',
			'drupal': 'https://www.drupal.org/search/site/',
			'yt': 'https://www.youtube.com/results?search_query=',
			'reddit': 'https://www.reddit.com/search?q=',
			'slickdeals': 'https://slickdeals.net/newsearch.php?q=',
			'stackoverflow': 'https://stackoverflow.com/search?q=',
			'twitter': 'https://twitter.com/search?q=',
			'github': 'https://github.com/search?q=',
			'archive': 'https://archive.org/search.php?query='
		};

		const searchForm = document.querySelector('form');
		const searchInput = searchForm.querySelector('input[type="text"]');

		searchForm.addEventListener('submit', event => {
			event.preventDefault();
			let query = searchInput.value.trim();
			if (query === '') {
				return;
			}

			let command = query.split(' ')[0];
			let searchUrl = searchCommands[command] || searchCommands['g'];
			query = query.replace(command, '').trim().replace(/\s+/g, '+');

			window.location.href = `${searchUrl}${query}`;
		});

		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.has('q')) {
			let query = urlParams.get('q').replace(/\+/g, ' ');
			searchInput.value = query;
			searchForm.submit();
		}
	</script>
</body>
</html>
