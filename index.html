<!DOCTYPE html>
<html data-theme="light">
<head>
	<title>sub - Search Hub</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
	<link rel="search" type="application/opensearchdescription+xml" title="sub - Search Hub" href="opensearch.xml">
	<link rel="manifest" href="manifest.json">
	<style>
		.search-form {
			display: flex;
			gap: 0.75rem;
			align-items: end;
			margin-bottom: 2rem;
		}
		.search-form input {
			flex: 4;
			margin-bottom: 0;
			font-size: 1.1rem;
			padding: 0.75rem;
			min-height: 44px;
		}
		.search-form button {
			flex: 1;
			margin-bottom: 0;
			white-space: nowrap;
			min-width: 80px;
			max-width: 120px;
			min-height: 44px;
			padding: 0.75rem 1rem;
			background-color: #0066cc;
			border-color: #0066cc;
		}
		.search-form button:hover {
			background-color: #0052a3;
			border-color: #0052a3;
		}
		
		.commands-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 1rem;
			margin-bottom: 2rem;
		}
		
		.command-card {
			display: block;
			padding: 1rem;
			border: 1px solid #e0e6ed;
			border-radius: 0.5rem;
			text-decoration: none;
			color: inherit;
			transition: all 0.2s ease;
			background: white;
			min-height: 44px;
			cursor: pointer;
		}
		
		.command-card:hover {
			border-color: #0066cc;
			box-shadow: 0 2px 8px rgba(0, 102, 204, 0.1);
			text-decoration: none;
			color: inherit;
		}
		
		.command-card.expanded {
			border-color: #0066cc;
		}
		
		.command-header {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			margin-bottom: 0.25rem;
		}
		
		.command-favicon {
			width: 16px;
			height: 16px;
			flex-shrink: 0;
		}
		
		.command-name {
			font-weight: bold;
			color: #0066cc;
			font-size: 1.1rem;
			cursor: pointer;
			padding: 0.25rem;
			border-radius: 0.25rem;
			transition: background-color 0.2s ease;
		}
		
		.command-name:hover {
			background-color: rgba(0, 102, 204, 0.1);
		}
		
		.command-site {
			color: #666;
			font-size: 0.9rem;
		}
		
		.command-details {
			grid-column: 1 / -1;
			margin: 1rem 0;
			padding: 1rem;
			border: 1px solid #e0e6ed;
			border-radius: 0.5rem;
			font-size: 0.85rem;
			color: #666;
			background: #f8f9fa;
			display: none;
		}
		
		.command-details.show {
			display: block;
		}
		
		.details-toggle {
			text-align: center;
			margin: 2rem 0;
		}
		
		.details-toggle button {
			background: none;
			border: 1px solid #0066cc;
			color: #0066cc;
			padding: 0.5rem 1rem;
			border-radius: 0.25rem;
			cursor: pointer;
			min-height: 44px;
		}
		
		.details-toggle button:hover {
			background-color: #0066cc;
			color: white;
		}
		
		.details-table {
			display: none;
		}
		
		.details-table.show {
			display: block;
		}
		
		table tbody > tr:nth-child(odd) td {
			background-color: #f3f5f7 !important;
		}
		
		.command-link {
			color: #0066cc;
			text-decoration: none;
			font-weight: bold;
		}
		
		.command-link:hover {
			text-decoration: underline;
		}
		
		@media (max-width: 768px) {
			.commands-grid {
				grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
			}
			
			table {
				font-size: 0.9rem;
			}
			
			table td:nth-child(2) {
				word-break: break-all;
				max-width: 200px;
			}
		}
		
		section {
			margin-top: 2rem;
		}
	</style>
	<script>
                const searchCommands = {
                    "ad": "https://www.audible.com/search?keywords=",
                    "am": "https://www.amazon.com/s?k=",
                    "ar": "https://archive.org/search.php?query=",
                    "as": "https://austin.bibliocommons.com/v2/search?searchType=smart&query=",
                    "bk": "https://www.bookpecker.com/search/",
                    "bl": "https://www.blinkist.com/en/app/search?q=%s",
                    "br": "https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=",
                    "ch": "https://ch.at/search?q=",
                    "cm": "https://camelcamelcamel.com/search?sq=",
                    "dr": "https://www.drupal.org/search/site/",
                    "eb": "https://www.ebay.com/sch/i.html?_sacat=0&_sop=15&_from=R40&_nkw=",
                    "g": "https://www.google.com/search?q=",
                    "gd": "https://www.goodreads.com/search?q=",
                    "gl": "https://www.google.com/search?btnI=1&q=",
                    "gn": "https://news.google.com/search?hl=en-US&gl=US&ceid=US%3Aen&q=",
                    "gt": "https://github.com/search?q=",
                    "hb": "https://www.heb.com/search/?q=",
                    "hp": "https://www.hoopladigital.com/search?page=1&q=",
                    "kg": "https://kagi.com/search?q=",
                    "ks": "https://kagi.com/summarizer/index.html?target_language=&summary=summary&url=",
                    "lb": "https://libbyapp.com/search/austinlibrary/search/scope-auto/query-%s/page-1",
                    "ls": "", // Will set to current URL later
                    "mc": "https://mcp.directory/servers?q=",
                    "lt": "https://www.listennotes.com/search/?q=",
                    "ov": "https://www.overdrive.com/search?q=",
                    "pn": "https://pinboard.in/search/?query=",
                    "pr": "https://www.perplexity.ai/search?q=",
                    "rd": "https://www.reddit.com/search/?q=",
                    "rn": "https://app.raindrop.io/my/0/",
                    "rr": "https://read.readwise.io/search?q=",
                    "rw": "https://readwise.io/search?q=",
                    "sb": "https://sobrief.com/search?q=",
                    "sg": "https://app.thestorygraph.com/browse?search_term=%s",
                    "sk": "https://skills.sh/?q=",
                    "sl": "https://slickdeals.net/newsearch.php?q=",
                    "sm": "https://www.smry.ai/proxy?url=",
                    "st": "https://stackoverflow.com/search?q=",
                    "th": "https://www.thriftbooks.com/browse/?b.search=",
                    "tw": "https://twitter.com/search?q=",
                    "vb": "https://vb.lk/",
                    "wk": "https://en.wikipedia.org/w/index.php?title=Special%3ASearch&ns0=1&fulltext=Search&search=",
                    "wr": "https://www.worldcat.org/search?q=",
                    "yt": "https://www.youtube.com/results?search_query="
                };

		// Check for URL parameters and redirect immediately if present
		var urlParams = new URLSearchParams(window.location.search);
		var urlQuery = urlParams.get("q");
		if (urlQuery && urlQuery.trim()) {
			var command = urlQuery.split(" ")[0];
			if (command !== "ls") {
				var url = searchCommands[command] || searchCommands["g"];
				if (command in searchCommands) {
					var searchTerm = urlQuery.slice(command.length + 1).trim();
					if (searchTerm) {
						if (url.includes('%s')) {
							window.location.href = url.replace('%s', encodeURIComponent(searchTerm));
						} else {
							window.location.href = url + encodeURIComponent(searchTerm);
						}
					} else {
						// No search term, redirect to base hostname
						var baseUrl = new URL(url);
						window.location.href = baseUrl.protocol + "//" + baseUrl.hostname;
					}
				} else {
					window.location.href = searchCommands["g"] + encodeURIComponent(urlQuery);
				}
			}
		}

	</script>
</head>
<body onload="if (!urlQuery) document.getElementById('search-box').focus();">
	<main class="container">
		<h1>sub - Search Hub</h1>
		<form method="get" action="./" class="search-form">
			<input type="text" id="search-box" name="q" placeholder="Enter search command and query..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
			<button type="submit">Search</button>
		</form>
		
		<section>
			<h2>Available Search Commands</h2>
			<div class="commands-grid" id="commandsGrid"></div>
		</section>
	</main>
	<script>
		// Site names for better UX
		const siteNames = {
			"ad": "Audible",
			"am": "Amazon",
			"ar": "Archive.org",
			"as": "Austin Public Library",
			"bk": "BookPecker",
			"br": "BoardGameGeek",
			"ch": "ch.at",
			"cm": "CamelCamelCamel",
			"dr": "Drupal.org",
			"eb": "eBay",
			"g": "Google",
			"gd": "Goodreads",
			"gl": "Google (I'm Feeling Lucky)",
			"gn": "Google News",
			"gt": "GitHub",
			"hb": "H-E-B",
			"hp": "Hoopla Digital",
			"kg": "Kagi",
			"ks": "Kagi Summarizer",
			"lb": "Libby (Austin Public Library)",
			"ls": "List commands (current page)",
			"lt": "Listen Notes",
			"ov": "OverDrive",
			"pn": "Pinboard",
			"pr": "Perplexity AI",
			"rd": "Reddit",
			"rn": "Raindrop.io",
			"rr": "Readwise Reader",
			"rw": "Readwise",
			"sb": "SoBrief",
			"sk": "Skills.sh",
			"sl": "Slickdeals",
			"sm": "Smry.ai",
			"st": "Stack Overflow",
			"th": "ThriftBooks",
			"tw": "Twitter",
			"vb": "vb.lk (Vibe Links)",
			"wk": "Wikipedia",
			"wr": "WorldCat",
			"yt": "YouTube"
		};

		function goToSite(command) {
			if (command === "ls") {
				return; // Don't redirect for ls command
			}
			var url = searchCommands[command];
			if (url) {
				var baseUrl = new URL(url);
				window.location.href = baseUrl.protocol + "//" + baseUrl.hostname;
			}
		}

		function toggleCardDetails(cardElement, command) {
			const grid = document.getElementById('commandsGrid');
			const allCards = grid.querySelectorAll('.command-card');
			const allDetails = grid.querySelectorAll('.command-details');
			
			// Close all expanded cards first
			allCards.forEach(card => card.classList.remove('expanded'));
			allDetails.forEach(detail => detail.classList.remove('show'));
			
			// Find which row this card is in
			const cardIndex = Array.from(allCards).indexOf(cardElement);
			const gridComputedStyle = window.getComputedStyle(grid);
			const gridColumns = gridComputedStyle.getPropertyValue('grid-template-columns').split(' ').length;
			const rowIndex = Math.floor(cardIndex / gridColumns);
			const lastCardInRow = Math.min((rowIndex + 1) * gridColumns - 1, allCards.length - 1);
			
			// Create or find the details element for this command
			let detailsElement = grid.querySelector(`[data-command="${command}"]`);
			if (!detailsElement) {
				detailsElement = document.createElement('div');
				detailsElement.className = 'command-details';
				detailsElement.setAttribute('data-command', command);
				detailsElement.innerHTML = `<strong>Command:</strong> ${command}<br><strong>URL:</strong> ${searchCommands[command]}`;
			}
			
			// Insert the details element after the last card in the row
			const insertAfter = allCards[lastCardInRow];
			insertAfter.parentNode.insertBefore(detailsElement, insertAfter.nextSibling);
			
			// Show the details and mark card as expanded
			detailsElement.classList.add('show');
			cardElement.classList.add('expanded');
		}

		// Update "ls" command to current URL
		searchCommands["ls"] = window.location.href;

		// Populate commands grid
		const commandsGrid = document.getElementById("commandsGrid");
		for (let [command, url] of Object.entries(searchCommands)) {
			if (command === "ls") continue; // Skip ls in the grid
			
			const card = document.createElement("div");
			card.className = "command-card";
			card.onclick = function(e) {
				if (e.target.classList.contains('command-name')) {
					// Command name clicked - go to site
					e.stopPropagation();
					goToSite(command);
				} else {
					// Card clicked - toggle details
					toggleCardDetails(card, command);
				}
			};
			
			// Create header with favicon and command name
			const commandHeader = document.createElement("div");
			commandHeader.className = "command-header";
			
			// Extract hostname for favicon
			const hostname = new URL(url).hostname;
			const favicon = document.createElement("img");
			favicon.className = "command-favicon";
			favicon.src = `https://www.google.com/s2/favicons?domain=${hostname}&sz=16`;
			favicon.alt = "";
			favicon.onerror = function() {
				// Hide favicon if it fails to load
				this.style.display = "none";
			};
			
			const commandName = document.createElement("div");
			commandName.className = "command-name";
			commandName.textContent = command;
			
			commandHeader.appendChild(favicon);
			commandHeader.appendChild(commandName);
			
			const siteName = document.createElement("div");
			siteName.className = "command-site";
			siteName.textContent = siteNames[command] || "Unknown Site";
			
			card.appendChild(commandHeader);
			card.appendChild(siteName);
			commandsGrid.appendChild(card);
		}

	</script>
	<script>
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('/search-hub/sw.js', {
				scope: '/search-hub/'
			})
			.then((registration) => {
				console.log('Service Worker: Registered with explicit scope.');
			})
			.catch((error) => {
				console.log('Service Worker: Registration Failed:', error);
			});
		}
	</script>
</body>
</html>
