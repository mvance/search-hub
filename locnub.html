<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Search Engine</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
  </head>
  <body>
    <div class="container">
      <form id="searchForm" method="get">
        <div class="row">
          <div class="twelve columns">
            <input type="text" name="q" placeholder="Search">
          </div>
        </div>
      </form>
    </div>

    <script>
      const searchCommands = {
        g: 'https://www.google.com/search?q=',
        wk: 'https://en.wikipedia.org/w/index.php?search=',
        gd: 'https://www.goodreads.com/search?q=',
        ad: 'https://www.audible.com/search?keywords=',
        hb: 'https://www.heb.com/search/?term=',
        dr: 'https://www.drupal.org/search/site/',
        yt: 'https://www.youtube.com/results?search_query=',
        rd: 'https://www.reddit.com/search/?q=',
        sl: 'https://slickdeals.net/newsearch.php?q=',
        st: 'https://stackoverflow.com/search?q=',
        tw: 'https://twitter.com/search?q=',
        gt: 'https://github.com/search?q=',
        ar: 'https://archive.org/search.php?query='
      };

      const searchForm = document.querySelector('#searchForm');
      const searchInput = searchForm.querySelector('input[name="q"]');

      function getSearchQuery() {
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        return urlParams.get('q');
      }

      function getSearchCommand(query) {
        const words = query.trim().split(' ');
        const firstWord = words[0].toLowerCase();
        if (searchCommands.hasOwnProperty(firstWord)) {
          return searchCommands[firstWord] + words.slice(1).join('+');
        } else {
          return searchCommands.g + query;
        }
      }

      function handleSearchFormSubmit(event) {
        event.preventDefault();
        const query = searchInput.value.trim();
        const searchUrl = getSearchCommand(query);
        window.location.href = searchUrl;
      }

      // Set the focus on the search input field when the page loads
      searchInput.focus();

      // Get the search query from the URL and submit the form
      const searchQuery = getSearchQuery();
      if (searchQuery) {
        searchInput.value = searchQuery;
        searchForm.submit();
      }

      searchForm.addEventListener('submit', handleSearchFormSubmit);
    </script>
  </body>
</html>
