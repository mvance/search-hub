<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Search Engine</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css">
	<style type="text/css">
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			padding: 0;
		}
		input[type=text] {
			font-size: 1.5rem;
			padding: 0.5rem;
			width: 30rem;
			max-width: 100%;
			border-radius: 0.25rem;
			border: none;
			box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
			outline: none;
		}
		input[type=submit] {
			font-size: 1.25rem;
			padding: 0.5rem 1rem;
			margin-left: 0.5rem;
			background-color: #4CAF50;
			color: white;
			border-radius: 0.25rem;
			border: none;
			cursor: pointer;
			box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
			transition: all 0.2s ease-in-out;
		}
		input[type=submit]:hover {
			background-color: #3e8e41;
		}
	</style>
</head>
<body>
	<form id="search-form">
		<input type="text" id="search-query" placeholder="Enter your search here">
		<input type="submit" value="Search">
	</form>
	<script type="text/javascript">
                const searchCommands = {
                  "g": "https://www.google.com/search?q=",
                  "am": "https://www.amazon.com/s?k=",
                  "wp": "https://en.wikipedia.org/w/index.php?search=",
                  "gr": "https://www.goodreads.com/search?q=",
                  "au": "https://www.audible.com/search?keywords=",
                  "hb": "https://www.heb.com/search/?q=",
                  "dr": "https://www.drupal.org/search/site/",
                  "yt": "https://www.youtube.com/results?search_query=",
                  "rd": "https://www.reddit.com/search/?q=",
                  "sd": "https://slickdeals.net/newsearch.php?q=",
                  "ar": "https://archive.org/search.php?query="
                };

		// Get search query from URL arguments
		const urlParams = new URLSearchParams(window.location.search);
		const searchQuery = urlParams.get('q');
		if (searchQuery) {
			document.getElementById('search-query').value = searchQuery;
			search();
		}

		// Focus on search field when page loads
		document.getElementById('search-query').focus();

		// Handle form submission
		document.getElementById('search-form').addEventListener('submit', function(e) {
			e.preventDefault();
			search();
		});

		// Perform search based on query
		function search() {
			const query = document.getElementById('search-query').value.trim().toLowerCase();
			let url = '';
			const parts = query.split(' ');
			if (parts.length < 2) {
				alert('Invalid search command');
				return;
			}
			const command = parts.shift();
			const commandUrl = searchCommands[command];
			if (!commandUrl) {
				alert('Invalid search command');
				return;
			}
			url = commandUrl + encodeURIComponent(parts.join(' '));
			window.location.href = url;
		}
	</script>
</body>
</html>
